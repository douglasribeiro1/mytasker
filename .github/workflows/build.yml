name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # para publicar cada versão em Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar plataforma e build-tools do Android
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          ls "$SDK_ROOT/platforms"

      - name: Preparar assinatura (usa os secrets, se existirem)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=mytasker"
              echo "keyPassword=$KEYSTORE_PASSWORD"
            } > keystore.properties
            echo "ASSINADO=true" >> "$GITHUB_ENV"
            echo "Assinatura configurada."
          else
            echo "::warning::Secrets ausentes: o APK sai sem assinatura e não instala por cima."
          fi

      - name: Compilar release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: pulso-release
          path: ciclo/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publicar versão (Releases, link direto do APK)
        if: env.ASSINADO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${{ github.run_number }}"
          cp ciclo/build/outputs/apk/release/*.apk "Pulso-$V.apk"
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notas.md
          printf '\nInstale o arquivo Pulso-%s.apk por cima da versão anterior. As configurações continuam.\n' "$V" >> notas.md
          gh release create "v$V" "Pulso-$V.apk" --target "${{ github.sha }}" \
            --title "Pulso $V" --notes-file notas.md --latest
